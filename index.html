<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Profile</title>
<style>
:root{--a:0,229,255;--c:124,92,255;--bg:#0b0d14;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.09);--tx:#f2f5fa;--mut:#9aa3b5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 40% at 15% 0%,rgba(var(--a),.16),transparent 70%),radial-gradient(60% 45% at 90% 100%,rgba(var(--c),.18),transparent 70%)}
svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding-bottom:calc(110px + env(safe-area-inset-bottom))}

/* الغلاف: نسخة مغبشة من الصورة */
.cover{position:absolute;inset:0 0 auto 0;height:360px;overflow:hidden;background:linear-gradient(160deg,rgba(var(--a),.5),rgba(var(--c),.5) 65%,var(--bg))}
.cover i{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(28px) saturate(1.3);opacity:0;transform:scale(1.1);transition:opacity .9s}
.cover i.on{opacity:.8}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,13,20,.1),rgba(11,13,20,.18) 70%,var(--bg) 100%)}

/* اللوجو الصغير */
.mini{position:relative;display:flex;justify-content:center;padding-top:calc(14px + env(safe-area-inset-top))}
.mini svg.logo{width:42px;height:42px;overflow:visible;stroke:none;fill:none;filter:drop-shadow(0 0 6px rgba(var(--a),.8))}
.logo .o{stroke:rgb(var(--a));fill:none}.logo .i{stroke:#06122a;fill:none}.logo .b{stroke:#e8fbff;stroke-width:2.4;stroke-linecap:round;fill:none}

.hero{position:relative;text-align:center;padding:14px 20px 4px}
.av{position:relative;width:148px;height:148px;margin:0 auto 18px;padding:4px;border-radius:50%;cursor:pointer;background:linear-gradient(135deg,rgb(var(--a)),rgb(var(--c)));box-shadow:0 14px 44px rgba(var(--a),.35)}
.av .in{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;border:4px solid var(--bg);background:#151a2a;display:grid;place-items:center;font:700 58px/1 "Segoe UI",Arial,sans-serif}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.av img.on{opacity:1}
.av.load .in::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.14),transparent 70%);background-size:200% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
h1{margin:0 0 6px;font-size:27px;line-height:1.3;font-weight:800;word-break:break-word}
.role{color:rgb(var(--a));font-weight:600;font-size:15px;margin-bottom:12px}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;font-size:13px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pill svg{width:15px;height:15px;color:rgb(var(--a))}

.acts{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:22px 12px 4px}
.act{width:70px;text-align:center;color:var(--tx);text-decoration:none;font-size:12px;cursor:pointer;background:none;border:0;font-family:inherit;padding:0}
.act .b{width:56px;height:56px;margin:0 auto 7px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:rgb(var(--a));transition:transform .15s}
.act:active .b{transform:scale(.92)}
.act.p .b{background:linear-gradient(135deg,rgba(var(--a),.78),rgba(var(--c),.78));color:#06101c;border:0;box-shadow:0 8px 22px rgba(var(--a),.35)}
.act svg{width:24px;height:24px}

.sec{padding:0 16px;margin-top:22px}
.lbl{margin:0 4px 10px;font:600 12px monospace;letter-spacing:3px;color:rgb(var(--a));text-shadow:0 0 8px rgba(var(--a),.7);direction:ltr;text-align:right;display:flex;align-items:center;gap:10px}
.lbl::before{content:"\25C6";font-size:9px}
.lbl::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(var(--a),.6),transparent)}
.rows{display:grid;gap:10px}

/* بلاطات HUD */
.tile{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:8px;text-decoration:none;color:inherit;min-height:62px;overflow:hidden;
 border:1px solid rgba(var(--a),.35);border-inline-start:3px solid rgb(var(--a));
 background:linear-gradient(90deg,rgba(var(--a),.11),rgba(255,255,255,.02) 65%);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .2s,box-shadow .2s}
.tile:active{transform:scale(.97);box-shadow:0 0 24px rgba(var(--a),.5)}
.tile::before,.about::before{content:"";position:absolute;inset:3px;pointer-events:none;z-index:1;opacity:.95;background-repeat:no-repeat;
 background-image:linear-gradient(rgb(var(--a)),rgb(var(--a))),linear-gradient(rgb(var(--a)),rgb(var(--a))),linear-gradient(rgb(var(--a)),rgb(var(--a))),linear-gradient(rgb(var(--a)),rgb(var(--a))),linear-gradient(rgb(var(--a)),rgb(var(--a))),linear-gradient(rgb(var(--a)),rgb(var(--a))),linear-gradient(rgb(var(--a)),rgb(var(--a))),linear-gradient(rgb(var(--a)),rgb(var(--a)));
 background-position:0 0,0 0,100% 0,100% 0,0 100%,0 100%,100% 100%,100% 100%;
 background-size:9px 2px,2px 9px,9px 2px,2px 9px,9px 2px,2px 9px,9px 2px,2px 9px}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(var(--a),.2),transparent 70%);transform:translateX(-120%);animation:gl 4.5s ease-in-out infinite;pointer-events:none}
@keyframes gl{60%,100%{transform:translateX(120%)}}
.tile .ic{flex:none;width:42px;height:42px;border-radius:6px;display:grid;place-items:center;color:rgb(var(--a));background:rgba(var(--a),.1);border:1px solid rgba(var(--a),.3);box-shadow:0 0 14px rgba(var(--a),.25)}
.tile .ic svg{width:21px;height:21px}
.tile .t{min-width:0;flex:1}
.tile small{display:block;opacity:.6;font-size:12px;margin-bottom:2px}
.tile .v{font-size:16px;word-break:break-word;direction:ltr;text-align:right;unicode-bidi:plaintext;line-height:1.35}
.tile .go{flex:none;width:18px;height:18px;opacity:.5;color:rgb(var(--a));transform:scaleX(-1)}
.about{position:relative;padding:15px 16px;border-radius:8px;line-height:1.95;font-size:15px;text-align:center;background:rgba(var(--a),.05);border:1px solid rgba(var(--a),.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* كارت الطفل */
.sos{display:flex;gap:13px;align-items:center;margin:20px 16px 0;padding:15px;border-radius:20px;background:linear-gradient(135deg,rgba(255,90,95,.16),rgba(255,180,70,.12));border:1px solid rgba(255,120,110,.5);font-weight:700;line-height:1.7}
.sos svg{flex:none;width:30px;height:30px;color:#ff8f86}
.call{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-radius:20px;text-decoration:none;color:#fff;background:linear-gradient(135deg,#22c55e,#15803d);box-shadow:0 10px 26px rgba(34,197,94,.28);margin-top:12px}
.call small{display:block;opacity:.85;font-size:12px}
.call b{font-size:25px;direction:ltr;unicode-bidi:plaintext;letter-spacing:.5px}
.call svg{width:30px;height:30px}
.note{margin:14px 16px 0;padding:14px;border-radius:18px;line-height:1.8;font-size:15px;background:rgba(255,200,80,.09);border:1px solid rgba(255,200,80,.45)}

.id{margin:26px 0 0;text-align:center;font:11px monospace;letter-spacing:4px;color:rgb(var(--a));text-shadow:0 0 8px rgba(var(--a),.6);opacity:.8;direction:ltr}
.bar{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:26px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 45%)}
.bar div{max-width:448px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;padding:15px;border:0;border-radius:18px;font:700 16px "Segoe UI",Tahoma,Arial,sans-serif;color:#06101c;cursor:pointer;text-decoration:none;background:linear-gradient(135deg,rgba(var(--a),.82),rgba(var(--c),.82));box-shadow:0 10px 28px rgba(var(--a),.32)}
.btn.g{flex:none;width:54px;padding:0;color:var(--tx);background:rgba(255,255,255,.1);border:1px solid var(--line);box-shadow:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.btn.call2{background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;box-shadow:0 10px 28px rgba(34,197,94,.3)}
.btn svg{width:21px;height:21px}
.btn:active{transform:scale(.97)}
.lb{position:fixed;inset:0;z-index:20;background:rgba(5,7,12,.92);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s}
.lb.on{opacity:1;pointer-events:auto}
.lb img{max-width:92vw;max-height:84vh;border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.toast{position:fixed;z-index:30;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;padding:10px 20px;border-radius:999px;background:#1b2133;border:1px solid var(--line);font-size:14px;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.rv{opacity:0;animation:up .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.err{position:relative;z-index:2;text-align:center;padding:30vh 24px 0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
