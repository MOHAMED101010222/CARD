<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#03060f">
<title>HOLO-ID</title>
<style>
:root{--a:0,229,255;--c:124,92,255}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#03060f;color:#e6f6ff;font-family:"Segoe UI",Tahoma,Arial,sans-serif;overflow-x:hidden;min-height:100vh;display:flex;justify-content:center}
#bg{position:fixed;inset:0;z-index:0}
.grid{position:fixed;inset:-50% -50% 0;z-index:0;background-image:linear-gradient(rgba(var(--a),.13) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--a),.13) 1px,transparent 1px);background-size:46px 46px;transform:perspective(500px) rotateX(62deg);animation:gm 3s linear infinite;mask-image:linear-gradient(transparent,#000 40%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 40%,transparent)}
@keyframes gm{to{background-position:0 46px}}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:0;animation:fo 14s ease-in-out infinite alternate}
.o1{width:340px;height:340px;background:rgb(var(--a));top:-90px;left:-90px}
.o2{width:380px;height:380px;background:rgb(var(--c));bottom:-120px;right:-100px;animation-delay:-6s}
@keyframes fo{to{transform:translate(60px,50px) scale(1.2)}}
.hex{position:fixed;z-index:0;width:60px;height:68px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:rgba(var(--a),.10);animation:fh linear infinite}
@keyframes fh{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}
.scan{position:fixed;left:0;right:0;height:140px;z-index:1;pointer-events:none;background:linear-gradient(transparent,rgba(var(--a),.07),transparent);animation:sc 6s linear infinite}
@keyframes sc{from{top:-140px}to{top:100%}}

main{position:relative;z-index:2;width:100%;max-width:480px;padding:26px 16px calc(40px + env(safe-area-inset-bottom));perspective:900px}
.tag{display:flex;align-items:center;gap:10px;justify-content:center;font:600 12px/1 monospace;letter-spacing:3px;color:rgb(var(--a));direction:ltr;margin-bottom:18px;text-shadow:0 0 10px rgba(var(--a),.7)}
.tag i{width:8px;height:8px;border-radius:50%;background:rgb(var(--a));box-shadow:0 0 12px rgb(var(--a));animation:pl 1.4s infinite}
@keyframes pl{50%{transform:scale(1.8);opacity:.4}}

/* الكارت الزجاجي */
.card{position:relative;border-radius:30px;padding:30px 18px 22px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.015));backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);transform-style:preserve-3d;transition:transform .18s;animation:in .9s cubic-bezier(.2,.9,.2,1) both;box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 60px rgba(var(--a),.12)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:conic-gradient(from var(--ang,0deg),rgb(var(--a)),rgb(var(--c)),transparent 40%,rgb(var(--a)));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:rot 5s linear infinite;pointer-events:none}
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes rot{to{--ang:360deg}}
@keyframes in{from{opacity:0;transform:translateY(40px) scale(.94)}}
.corner{position:absolute;width:22px;height:22px;border:3px solid rgb(var(--a));filter:drop-shadow(0 0 6px rgb(var(--a)));pointer-events:none}
.cl1{top:10px;left:10px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}.cl2{top:10px;right:10px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.cl3{bottom:10px;left:10px;border-right:0;border-top:0;border-radius:0 0 0 10px}.cl4{bottom:10px;right:10px;border-left:0;border-top:0;border-radius:0 0 10px 0}

/* الصورة جوا الدواير */
.av{position:relative;width:168px;height:168px;margin:14px auto 22px;display:grid;place-items:center}
.av b{position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:rgb(var(--a));border-bottom-color:rgb(var(--c));animation:spin 4s linear infinite;filter:drop-shadow(0 0 8px rgb(var(--a)))}
.av b+b{inset:-12px;border:2px dashed rgba(var(--a),.6);animation:spin 9s linear infinite reverse}
.av b+b+b{inset:-24px;border:2px solid transparent;border-left-color:rgb(var(--c));animation-duration:6s}
@keyframes spin{to{transform:rotate(360deg)}}
.av span{position:relative;overflow:hidden;width:136px;height:136px;border-radius:50%;display:grid;place-items:center;font:700 58px/1 "Segoe UI",Arial;color:#fff;background:radial-gradient(circle at 30% 25%,rgba(var(--a),.55),rgba(var(--c),.45) 60%,#06102a);box-shadow:inset 0 0 30px rgba(0,0,0,.4),0 0 34px rgba(var(--a),.5);animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 0 30px rgba(0,0,0,.4),0 0 56px rgba(var(--a),.85)}}
.av span img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .6s;animation:breathe 6s ease-in-out infinite}
.av span img.ok{opacity:1}
@keyframes breathe{50%{transform:scale(1.05)}}
.av span::after{content:"";position:absolute;left:0;right:0;height:38%;background:linear-gradient(transparent,rgba(var(--a),.35),transparent);animation:ps 3s ease-in-out infinite;pointer-events:none;mix-blend-mode:screen}
@keyframes ps{from{top:-40%}to{top:105%}}
.av.load span{background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}

h1{margin:6px 0 12px;text-align:center;font-size:28px;line-height:1.3;background:linear-gradient(90deg,#fff,rgb(var(--a)),#fff,rgb(var(--c)));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite,rv 1s ease both;filter:drop-shadow(0 0 12px rgba(var(--a),.35))}
@keyframes sh{to{background-position:300% 0}}
@keyframes rv{from{opacity:0;letter-spacing:8px;filter:blur(8px)}}
.sub{text-align:center;color:rgb(var(--a));font-weight:600;font-size:16px;margin-bottom:16px;text-shadow:0 0 12px rgba(var(--a),.6)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;font-size:13px;border:1px solid rgba(var(--a),.45);background:rgba(var(--a),.07);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip svg{width:15px;height:15px}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.about{margin:0 0 16px;padding:13px 14px;border-radius:16px;text-align:center;line-height:1.9;font-size:15px;background:rgba(var(--a),.05);border:1px solid rgba(var(--a),.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* شريط الأزرار السريعة (زجاجية شفافة) */
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:10px;margin:0 0 16px}
.act{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 6px 11px;border-radius:18px;text-decoration:none;color:#e6f6ff;font:600 12px "Segoe UI",Tahoma,Arial;background:rgba(255,255,255,.035);border:1px solid rgba(var(--a),.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;overflow:hidden;opacity:0;animation:up .6s ease forwards;transition:transform .2s,box-shadow .2s,background .2s}
.act svg{width:24px;height:24px;color:rgb(var(--a));filter:drop-shadow(0 0 6px rgba(var(--a),.8))}
.act::after,.tile::after,.gbtn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(var(--a),.22),transparent 70%);transform:translateX(-120%);animation:gl 4.5s ease-in-out infinite;pointer-events:none}
@keyframes gl{60%,100%{transform:translateX(120%)}}
.act:active,.tile:active,.gbtn:active{transform:scale(.96);background:rgba(var(--a),.14);box-shadow:0 0 24px rgba(var(--a),.5)}
@media(hover:hover){.act:hover,.tile:hover,.gbtn:hover{box-shadow:0 0 22px rgba(var(--a),.4);background:rgba(var(--a),.08)}}

/* بلاطات البيانات */
.sec{margin:6px 4px 10px;font:600 11px monospace;letter-spacing:3px;color:rgba(var(--a),.85);direction:ltr;text-align:right;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(var(--a),.6),transparent)}
.rows{display:grid;grid-template-columns:1fr;gap:10px}
.tile{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;text-decoration:none;color:inherit;background:rgba(255,255,255,.035);border:1px solid rgba(var(--a),.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:hidden;opacity:0;animation:up .6s ease forwards;transition:transform .2s,box-shadow .2s,background .2s;min-height:62px}
.tile .ic{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:rgb(var(--a));background:rgba(var(--a),.1);border:1px solid rgba(var(--a),.3);box-shadow:0 0 14px rgba(var(--a),.25)}
.tile .ic svg{width:21px;height:21px}
.tile .tx{min-width:0;flex:1}.tile small{display:block;opacity:.6;font-size:12px;margin-bottom:2px}
.tile .v{font-size:16px;word-break:break-word;direction:ltr;text-align:right;unicode-bidi:plaintext;line-height:1.35}
.tile .go{flex:none;width:18px;height:18px;opacity:.5;color:rgb(var(--a));transform:scaleX(-1)}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* أزرار سفلية زجاجية */
.foots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.gbtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:9px;padding:14px 8px;border-radius:18px;font:700 15px "Segoe UI",Tahoma,Arial;color:#e6f6ff;cursor:pointer;background:rgba(var(--a),.06);border:1px solid rgba(var(--a),.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 18px rgba(var(--a),.25),inset 0 0 18px rgba(var(--a),.08);animation:bp 2.8s ease-in-out infinite;transition:transform .2s}
.gbtn svg{width:20px;height:20px;color:rgb(var(--a))}
.gbtn.one{grid-column:1/-1}
@keyframes bp{50%{box-shadow:0 0 32px rgba(var(--a),.6),inset 0 0 22px rgba(var(--a),.16)}}
.foot{margin-top:18px;text-align:center;font:11px monospace;letter-spacing:2px;opacity:.55;direction:ltr;word-break:break-all}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;z-index:9;padding:10px 20px;border-radius:999px;background:rgba(var(--a),.14);border:1px solid rgba(var(--a),.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:.35s;pointer-events:none;font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* كارت الطفل */
.alert{display:flex;align-items:center;gap:12px;margin:0 0 16px;padding:13px 14px;border-radius:18px;font-weight:700;line-height:1.6;background:rgba(255,80,80,.1);border:1px solid rgba(255,110,110,.65);color:#ffe0e0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:al 1.6s infinite}
.alert svg{flex:none;width:28px;height:28px;color:#ff8a8a}
@keyframes al{50%{box-shadow:0 0 24px rgba(255,80,80,.55)}}
.kid .tile.call{min-height:78px;border-color:rgba(255,120,120,.55)}
.kid .tile.call .v{font-size:24px;font-weight:700}
.kid .tile.call .ic{color:#ff9a9a;border-color:rgba(255,120,120,.5);background:rgba(255,90,90,.1)}
.kid .acts{grid-template-columns:1fr 1fr}
.note{margin-top:12px;padding:13px 14px;border-radius:16px;background:rgba(255,200,80,.08);border:1px solid rgba(255,200,80,.5);font-size:15px;line-height:1.8;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.err{text-align:center;margin-top:30vh;position:relative;z-index:2;width:100%;padding:0 20px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}

/* ===== ستايل الكارت (HUD) ===== */
body{position:relative}
.herobg{position:absolute;top:0;left:0;right:0;height:560px;z-index:1;background-size:cover;background-position:center 20%;filter:blur(26px) saturate(1.3) brightness(.65);transform:scale(1.25);opacity:0;transition:opacity 1.2s;-webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent);pointer-events:none}
.herobg.on{opacity:.95}
.tag.lg{margin-bottom:4px}
.tag.lg svg.logo{width:84px;height:84px;overflow:visible;stroke:none;fill:none;filter:drop-shadow(0 0 9px rgba(var(--a),.85))}
.logo .o{stroke:rgb(var(--a));fill:none}.logo .i{stroke:#06122a;fill:none}.logo .b{stroke:#e8fbff;stroke-width:2.4;stroke-linecap:round;fill:none}
.card{border-radius:22px;background:linear-gradient(160deg,rgba(var(--a),.10),rgba(255,255,255,.015) 55%,rgba(var(--c),.07))}
.chip{border-radius:8px;font-family:monospace,"Segoe UI",Tahoma;letter-spacing:.5px;background:linear-gradient(90deg,rgba(var(--a),.14),rgba(var(--a),.04))}
.tile,.act,.gbtn,.about{border-radius:8px}
.tile{border-color:rgba(var(--a),.35);border-inline-start:3px solid rgb(var(--a));background:linear-gradient(90deg,rgba(var(--a),.11),rgba(255,255,255,.02) 65%)}
.act{background:linear-gradient(180deg,rgba(var(--a),.10),rgba(255,255,255,.02))}
.about{position:relative}
.tile::before,.act::before,.about::before,.gbtn::before{content:"";position:absolute;inset:3px;pointer-events:none;z-index:1;opacity:.95;background-repeat:no-repeat;
 background-image:linear-gradient(rgb(var(--a)),rgb(var(--a))),linear-gradient(rgb(var(--a)),rgb(var(--a))),linear-gradient(rgb(var(--a)),rgb(var(--a))),linear-gradient(rgb(var(--a)),rgb(var(--a))),linear-gradient(rgb(var(--a)),rgb(var(--a))),linear-gradient(rgb(var(--a)),rgb(var(--a))),linear-gradient(rgb(var(--a)),rgb(var(--a))),linear-gradient(rgb(var(--a)),rgb(var(--a)));

 background-size:9px 2px,2px 9px,9px 2px,2px 9px,9px 2px,2px 9px,9px 2px,2px 9px}
.tile .ic{border-radius:6px}
.sec{font-size:12px;color:rgb(var(--a));text-shadow:0 0 8px rgba(var(--a),.7)}
.sec::before{content:"\25C6";font-size:9px}
.foot{opacity:.8;color:rgb(var(--a));text-shadow:0 0 8px rgba(var(--a),.6);letter-spacing:4px}

function svg(n){var s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 24 24');s.innerHTML=IC[n]||IC.link;return s}
function b64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function load(){
 var h=location.hash.slice(1);if(!h)return null;
 var u=b64(h.slice(1));
 if(h[0]==='z'){var st=new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate'));return JSON.parse(await new Response(st).text())}
 return JSON.parse(new TextDecoder().decode(u));
}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

function url(w){w=w.trim();return /^https?:\/\//i.test(w)?w:'https://'+w}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.k);toast.k=setTimeout(function(){t.classList.remove('on')},1800)}
var DELAY=0;function nd(){return (0.45+(DELAY++)*0.09)+'s'}

function vcf(d){
 var L=['BEGIN:VCARD','VERSION:3.0','FN:'+d.n,'N:'+d.n+';;;;'];
 if(d.t)L.push('TITLE:'+d.t);if(d.ph)L.push('TEL:'+digits(d.ph));if(d.wa)L.push('TEL;TYPE=CELL:'+digits(d.wa));if(d.em)L.push('EMAIL:'+d.em);if(d.web)L.push('URL:'+url(d.web));if(d.ad)L.push('ADR:;;'+d.ad+';;;;');

function loadPic(span,av,u,bg){
 var tries=[u,'https://wsrv.nl/?w=480&h=480&fit=cover&a=attention&url='+encodeURIComponent(u.replace(/^https?:\/\//,''))],i=0;
 av.classList.add('load');
 (function next(){
  if(i>=tries.length){av.classList.remove('load');return}
  var im=new Image(),done=false;im.alt='';im.decoding='async';im.referrerPolicy='no-referrer';
  var to=setTimeout(function(){if(!done){done=true;next()}},9000);
  im.onload=function(){if(done)return;done=true;clearTimeout(to);av.classList.remove('load');if(bg){bg.style.backgroundImage='url("'+im.src+'")';bg.classList.add('on')}span.textContent='';span.appendChild(im);requestAnimationFrame(function(){im.classList.add('ok')})};
  im.onerror=function(){if(done)return;done=true;clearTimeout(to);next()};
  im.src=tries[i++]})()}

 }else{

  var rows=el('div','rows'),n0=0;

  var SOC={ig:['انستجرام','https://instagram.com/'],fb:['فيسبوك','https://facebook.com/'],li:['لينكدإن','https://linkedin.com/in/'],tg:['تيليجرام','https://t.me/'],gh:['GitHub','https://github.com/'],tt:['تيك توك','https://tiktok.com/@'],yt:['يوتيوب','https://youtube.com/@'],tw:['X / تويتر','https://x.com/']};
  Object.keys(SOC).forEach(function(k){if(d[k]){var sc=SOC[k],v=String(d[k]).trim(),isu=/^https?:\/\//i.test(v)||/^www\./i.test(v)||v.indexOf('/')>-1;tile(rows,'user',sc[0],v.replace(/^https?:\/\//i,''),isu?url(v):sc[1]+v.replace(/^@/,''));n0++}});
  if(d.ad){tile(rows,'pin','العنوان',d.ad,'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(d.ad));n0++}
  (d.ln||[]).forEach(function(l){tile(rows,'link','رابط',String(l).replace(/^https?:\/\//i,''),url(String(l)));n0++});
  if(n0){card.appendChild(el('div','sec','// DATA'));card.appendChild(rows)}

 function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;P=[];var n=Math.min(70,Math.floor(W*H/18000));for(var i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5})}

  P.forEach(function(p,i){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;x.fillStyle='rgba('+c+',.8)';x.beginPath();x.arc(p.x,p.y,1.8,0,6.283);x.fill();

  requestAnimationFrame(f)})();
 for(var i=0;i<8;i++){var h=el('div','hex');h.style.left=Math.random()*95+'%';h.style.animationDuration=(14+Math.random()*16)+'s';h.style.animationDelay=(-Math.random()*20)+'s';h.style.transform='scale('+(.5+Math.random())+')';document.body.appendChild(h)}
